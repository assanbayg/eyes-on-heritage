[project]
name = "eyes-on-heritage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
tifs = [
    "geopandas>=1.2.0",
    "rasterio>=1.5.2",
]
